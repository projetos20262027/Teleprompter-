<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/fontsource-inter@4.5.0/latin.css" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --surface: rgba(255,255,255,0.06);
            --surface-hover: rgba(255,255,255,0.12);
            --border: rgba(255,255,255,0.1);
            --text: #fff;
            --text-dim: rgba(255,255,255,0.45);
            --accent: #3b82f6;
            --accent-glow: rgba(59,130,246,0.3);
            --red: #ef4444;
            --red-glow: rgba(239,68,68,0.3);
            --green: #22c55e;
            --orange: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ── Permission Screen ── */
        #permScreen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            transition: opacity .6s, transform .6s;
        }
        #permScreen.gone {
            opacity: 0;
            transform: scale(1.08);
            pointer-events: none;
        }

        .perm-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent), #8b5cf6, var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spinRing 3s linear infinite;
            margin-bottom: 36px;
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }
        .perm-ring-inner {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .perm-ring-inner svg { width: 52px; height: 52px; fill: var(--accent); }

        .perm-title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }
        .perm-sub {
            color: var(--text-dim);
            font-size: 16px;
            max-width: 380px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 44px;
        }
        .perm-go {
            padding: 16px 52px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }
        .perm-go:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 40px var(--accent-glow);
        }
        .perm-err {
            color: var(--red);
            margin-top: 16px;
            font-size: 14px;
            display: none;
            text-align: center;
            max-width: 360px;
        }

        /* ── Main App ── */
        #mainApp {
            display: none;
            height: 100vh;
            position: relative;
        }
        #mainApp.on { display: flex; flex-direction: column; }

        #cameraBg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        #cameraBg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .cam-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
            pointer-events: none;
        }
        .cam-vignette-top {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 140px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            z-index: 1;
            pointer-events: none;
        }
        .cam-vignette-bot {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 140px;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            z-index: 1;
            pointer-events: none;
        }

        /* ── Top Bar ── */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .logo i { color: var(--accent); font-style: normal; }
        .badge {
            padding: 5px 14px;
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green);
        }

        /* ── Script Panel ── */
        #scriptPanel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 10;
            transition: transform .45s cubic-bezier(.4,0,.2,1);
        }
        #scriptPanel.shrink { transform: translateY(calc(100% - 56px)); }

        .panel-grip {
            width: 44px;
            height: 5px;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
            margin: 10px auto 0;
            cursor: pointer;
        }

        .panel-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px 0;
        }
        .panel-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
        }
        .panel-chars {
            font-size: 12px;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
        }

        #scriptBox {
            width: 100%;
            min-height: 100px;
            max-height: 45vh;
            margin: 8px 0;
            padding: 0 20px;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            line-height: 1.7;
            resize: none;
            outline: none;
        }
        #scriptBox::placeholder { color: var(--text-dim); }

        .panel-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 20px 24px;
            flex-wrap: wrap;
        }

        .ctrl {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
        }
        .ctrl small {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .ctrl .val {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent);
            min-width: 24px;
            text-align: center;
        }
        .cbtn {
            width: 30px; height: 30px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
            font-weight: 700;
        }
        .cbtn:hover { background: rgba(255,255,255,0.16); }

        .rec-btn {
            padding: 13px 36px;
            border-radius: 50px;
            border: none;
            background: var(--red);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform .2s, box-shadow .2s;
        }
        .rec-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 24px var(--red-glow);
        }
        .rec-btn svg { width: 20px; height: 20px; fill: currentColor; }

        /* ── Countdown ── */
        #countdown {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(24px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #countdown.on { display: flex; }
        .count-num {
            font-size: 200px;
            font-weight: 900;
            color: #fff;
            animation: popIn .9s ease-out both;
            text-shadow: 0 0 80px rgba(239,68,68,0.5);
            line-height: 1;
        }
        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .count-label {
            font-size: 15px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 20px;
        }

        /* ── Recording Screen ── */
        #recScreen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
        }
        #recScreen.on { display: block; }

        #recVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* TP overlay */
        .tp-fade-t {
            position: absolute; top: 0; left: 0; right: 0;
            height: 28%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            pointer-events: none;
            z-index: 105;
        }
        .tp-fade-b {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 28%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: none;
            z-index: 105;
        }
        .tp-line {
            position: absolute;
            top: 40%;
            left: 8%;
            right: 8%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent);
            z-index: 106;
            pointer-events: none;
        }

        .tp-box {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
            z-index: 104;
        }
        .tp-scroll {
            width: 88%;
            max-width: 900px;
            height: 100vh;
            position: relative;
        }
        .tp-inner {
            position: absolute;
            width: 100%;
            text-align: center;
            will-change: transform;
            padding: 50vh 12px;
            transition: opacity .3s;
        }
        .tp-inner p {
            color: #fff;
            font-weight: 600;
            line-height: 1.55;
            text-shadow: 0 0 40px rgba(0,0,0,1), 0 2px 16px rgba(0,0,0,.85);
            margin-bottom: 1em;
        }

        /* rec top */
        .rec-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 110;
        }
        .rec-live {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rec-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--red);
            animation: blinkDot 1s infinite;
        }
        @keyframes blinkDot {
            0%,100%{ opacity:1; }
            50%{ opacity:.25; }
        }
        .rec-clock {
            font-size: 20px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        .rec-badge {
            padding: 4px 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
            font-weight: 700;
        }

        /* progress */
        .tp-prog {
            position: absolute;
            bottom: 115px;
            left: 8%;
            right: 8%;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            z-index: 110;
            overflow: hidden;
        }
        .tp-prog-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
        }

        /* rec bottom bar */
        .rec-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px 16px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 110;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        }
        .rb {
            width: 46px; height: 46px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background .15s, border-color .15s;
        }
        .rb:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); }
        .rb svg { width: 22px; height: 22px; fill: currentColor; }

        .rb-stop {
            width: 62px; height: 62px;
            border-radius: 50%;
            background: var(--red);
            border-color: var(--red);
        }
        .rb-stop:hover { background: #dc2626; border-color: #dc2626; }

        .rb-rw {
            background: rgba(59,130,246,0.2);
            border-color: var(--accent);
        }
        .rb-rw:hover { background: rgba(59,130,246,0.35); }

        .sp-label {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent);
            min-width: 38px;
            text-align: center;
        }

        /* ── Gallery ── */
        #gallery {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 15;
            max-height: 35vh;
            overflow-y: auto;
            padding: 16px 20px 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.92) 50%, transparent);
            display: none;
        }
        #gallery.on { display: block; }
        .gal-head {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }
        .gal-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .gal-card {
            flex-shrink: 0;
            width: 180px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        .gal-card video {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background: #111;
            display: block;
        }
        .gal-info {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .gal-info span { font-size: 11px; font-weight: 600; }
        .gal-dl {
            width: 30px; height: 30px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gal-dl svg { width: 15px; height: 15px; fill: currentColor; }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 10px 22px;
            background: rgba(20,20,30,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            z-index: 300;
            opacity: 0;
            transition: all .3s;
            pointer-events: none;
            backdrop-filter: blur(12px);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 640px) {
            .perm-title { font-size: 24px; }
            .perm-ring { width: 110px; height: 110px; }
            .perm-ring-inner { width: 94px; height: 94px; }
            .perm-ring-inner svg { width: 40px; height: 40px; }
            .count-num { font-size: 130px; }
            .rec-btn { padding: 11px 22px; font-size: 14px; }
            .rb { width: 40px; height: 40px; }
            .rb-stop { width: 54px; height: 54px; }
        }
    </style>
</head>
<body>

<!-- Permission -->
<div id="permScreen">
    <div class="perm-ring"><div class="perm-ring-inner">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </div></div>
    <div class="perm-title">Acesso à Câmera</div>
    <div class="perm-sub">Permita o acesso à câmera para gravar vídeos em alta qualidade com teleprompter integrado.</div>
    <button class="perm-go" onclick="goCamera()">Permitir Acesso</button>
    <div class="perm-err" id="permErr"></div>
</div>

<!-- Main App -->
<div id="mainApp">
    <div id="cameraBg">
        <video id="mainVid" autoplay muted playsinline></video>
    </div>
    <div class="cam-vignette"></div>
    <div class="cam-vignette-top"></div>
    <div class="cam-vignette-bot"></div>

    <div class="topbar">
        <div class="logo">Teleprompter <i>Studio</i></div>
        <div class="badge"><div class="badge-dot"></div><span id="resBadge">—</span></div>
    </div>

    <!-- Script Panel -->
    <div id="scriptPanel" class="shrink">
        <div class="panel-grip" onclick="togglePanel()"></div>
        <div class="panel-bar">
            <span class="panel-label">Roteiro</span>
            <span class="panel-chars" id="charCount">0 caracteres</span>
        </div>
        <textarea id="scriptBox" placeholder="Cole ou digite seu texto aqui...&#10;&#10;Sem limite de caracteres.&#10;Pressione os +/− para ajustar velocidade e tamanho da fonte."></textarea>
        <div class="panel-actions">
            <div class="ctrl">
                <small>Vel.</small>
                <button class="cbtn" onclick="chgSpeed(-1)">−</button>
                <span class="val" id="speedVal">5</span>
                <button class="cbtn" onclick="chgSpeed(1)">+</button>
            </div>
            <div class="ctrl">
                <small>Fonte</small>
                <button class="cbtn" onclick="chgFont(-2)">−</button>
                <span class="val" id="fontVal">32</span>
                <button class="cbtn" onclick="chgFont(2)">+</button>
            </div>
            <button class="rec-btn" id="goBtn" onclick="startCountdown()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
                Gravar
            </button>
        </div>
    </div>
</div>

<!-- Countdown -->
<div id="countdown">
    <div class="count-num" id="countNum">5</div>
    <div class="count-label">Preparando gravação</div>
</div>

<!-- Recording Screen -->
<div id="recScreen">
    <video id="recVid" autoplay muted playsinline></video>

    <div class="tp-fade-t"></div>
    <div class="tp-fade-b"></div>
    <div class="tp-line"></div>

    <div class="tp-box">
        <div class="tp-scroll">
            <div class="tp-inner" id="tpInner"></div>
        </div>
    </div>

    <div class="rec-top">
        <div class="rec-live">
            <div class="rec-dot"></div>
            <span class="rec-clock" id="recClock">00:00</span>
        </div>
        <span class="rec-badge" id="recBadge">4K</span>
    </div>

    <div class="tp-prog"><div class="tp-prog-fill" id="tpFill"></div></div>

    <div class="rec-bar">
        <button class="rb" onclick="chgRecSpeed(-1)" title="Velocidade −">
            <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
        </button>
        <span class="sp-label" id="recSpd">5x</span>
        <button class="rb" onclick="chgRecSpeed(1)" title="Velocidade +">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>

        <button class="rb" id="tpVisBtn" onclick="toggleTP()" title="Teleprompter on/off">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>

        <button class="rb rb-rw" onclick="rewindTP()" title="Voltar ao início">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>

        <button class="rb" onclick="chgRecFont(-2)" title="Fonte −">
            <svg viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9zm-6 8h3v7h3v-7h3V9H3v3z"/></svg>
        </button>
        <button class="rb" onclick="chgRecFont(2)" title="Fonte +">
            <svg viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9zm-6 8h3v7h3v-7h3V9H3v3z"/></svg>
        </button>

        <button class="rb rb-stop" onclick="stopRec()" title="Parar">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
    </div>
</div>

<!-- Gallery -->
<div id="gallery">
    <div class="gal-head">Gravações</div>
    <div class="gal-list" id="galList"></div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════ STATE ═══════════════════ */
let stream = null;
let recorder = null;
let chunks = [];
let recording = false;
let recStart = 0;
let recTimer = null;
let tpPos = 0;
let tpSpeed = 5;
let tpFont = 32;
let tpShow = true;
let tpRAF = null;
let clips = [];
let clipN = 0;
let panelUp = true;
let vw = 1920, vh = 1080;
let mimeType = 'video/webm';

/* ═══════════════════ ELEMENTS ═══════════════════ */
const $perm     = document.getElementById('permScreen');
const $app      = document.getElementById('mainApp');
const $mainVid  = document.getElementById('mainVid');
const $box      = document.getElementById('scriptBox');
const $count    = document.getElementById('charCount');
const $badge    = document.getElementById('resBadge');
const $panel    = document.getElementById('scriptPanel');
const $countdown= document.getElementById('countdown');
const $countNum = document.getElementById('countNum');
const $rec      = document.getElementById('recScreen');
const $recVid   = document.getElementById('recVid');
const $tp       = document.getElementById('tpInner');
const $clock    = document.getElementById('recClock');
const $recBadge = document.getElementById('recBadge');
const $fill     = document.getElementById('tpFill');
const $gal      = document.getElementById('gallery');
const $galList  = document.getElementById('galList');

/* ═══════════════════ CHAR COUNT ═══════════════════ */
$box.addEventListener('input', () => {
    $count.textContent = $box.value.length.toLocaleString('pt-BR') + ' caracteres';
});

/* ═══════════════════ CAMERA ═══════════════════ */
async function goCamera() {
    const err = document.getElementById('permErr');
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 3840 }, height: { ideal: 2160 } },
            audio: true
        });

        const vt = stream.getVideoTracks()[0];
        const s = vt.getSettings();
        vw = s.width  || 1920;
        vh = s.height || 1080;
        $badge.textContent = vw + '×' + vh;
        $recBadge.textContent = vw >= 3840 ? '4K' : vh + 'p';

        /* pick best mimeType */
        for (const t of [
            'video/webm;codecs=vp9,opus',
            'video/webm;codecs=vp8,opus',
            'video/webm',
            'video/mp4'
        ]) {
            if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; }
        }

        $mainVid.srcObject = stream;
        $perm.classList.add('gone');
        setTimeout(() => { $perm.style.display = 'none'; $app.classList.add('on'); toast('Câmera ' + vw + '×' + vh); }, 600);
    } catch (e) {
        err.textContent = 'Não foi possível acessar a câmera. Verifique as permissões.';
        err.style.display = 'block';
    }
}

/* ═══════════════════ PANEL ═══════════════════ */
function togglePanel() {
    panelUp = !panelUp;
    $panel.classList.toggle('shrink', !panelUp);
}

/* ═══════════════════ CONTROLS ═══════════════════ */
function chgSpeed(d) {
    tpSpeed = clamp(tpSpeed + d, 1, 20);
    document.getElementById('speedVal').textContent = tpSpeed;
}
function chgFont(d) {
    tpFont = clamp(tpFont + d, 18, 80);
    document.getElementById('fontVal').textContent = tpFont;
}
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/* ═══════════════════ COUNTDOWN ═══════════════════ */
function startCountdown() {
    if (!$box.value.trim()) { toast('Digite o roteiro antes de gravar.'); return; }
    $panel.classList.add('shrink');
    panelUp = false;

    $countdown.classList.add('on');
    let n = 5;
    $countNum.textContent = n;
    $countNum.style.animation = 'none';
    void $countNum.offsetHeight;
    $countNum.style.animation = 'popIn .9s ease-out both';

    const iv = setInterval(() => {
        n--;
        if (n > 0) {
            $countNum.textContent = n;
            $countNum.style.animation = 'none';
            void $countNum.offsetHeight;
            $countNum.style.animation = 'popIn .9s ease-out both';
        } else {
            clearInterval(iv);
            $countdown.classList.remove('on');
            beginRec();
        }
    }, 1000);
}

/* ═══════════════════ RECORDING ═══════════════════ */
function beginRec() {
    recording = true;
    chunks = [];

    /* video element */
    $recVid.srcObject = stream;

    /* teleprompter text */
    const lines = $box.value.trim().split('\n');
    $tp.innerHTML = lines.filter(l => l.trim()).map(l => '<p>' + escHTML(l) + '</p>').join('');
    $tp.style.fontSize = tpFont + 'px';

    /* reset */
    tpPos = 0;
    $tp.style.transform = 'translateY(0px)';
    $fill.style.width = '0%';
    tpShow = true;
    $tp.style.opacity = '1';

    $rec.classList.add('on');

    /* start recorder */
    startRecorder();

    /* scroll */
    tpScrollLoop();

    /* timer */
    recStart = Date.now();
    recTimer = setInterval(tickClock, 1000);

    toast('Gravando!');
}

function startRecorder() {
    const opts = {
        mimeType: mimeType,
        videoBitsPerSecond: 50000000,
        audioBitsPerSecond: 320000
    };
    try {
        recorder = new MediaRecorder(stream, opts);
    } catch(e) {
        try {
            recorder = new MediaRecorder(stream, { videoBitsPerSecond: 50000000, audioBitsPerSecond: 320000 });
        } catch(e2) {
            recorder = new MediaRecorder(stream);
        }
    }

    /* CRITICAL: collect chunks reliably */
    recorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) {
            chunks.push(ev.data);
        }
    };

    recorder.onstop = () => {
        /* Build blob from ALL accumulated chunks */
        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });

        if (blob.size < 1000) {
            toast('Erro: gravação vazia. Tente novamente.');
            return;
        }

        const url = URL.createObjectURL(blob);
        clipN++;

        clips.unshift({
            id: clipN,
            url,
            blob,
            dur: $clock.textContent,
            res: $recBadge.textContent,
            ts: new Date().toLocaleString('pt-BR')
        });

        drawGallery();
        toast('Gravação #' + clipN + ' salva (' + clips[0].dur + ')');
    };

    /* request data every 200ms for reliable capture */
    recorder.start(200);
}

function tickClock() {
    const el = Math.floor((Date.now() - recStart) / 1000);
    const m = String(Math.floor(el / 60)).padStart(2, '0');
    const s = String(el % 60).padStart(2, '0');
    $clock.textContent = m + ':' + s;
}

function tpScrollLoop() {
    if (tpRAF) cancelAnimationFrame(tpRAF);
    function step() {
        tpPos += tpSpeed * 0.4;
        const maxS = $tp.scrollHeight - window.innerHeight;
        if (maxS > 0) {
            $fill.style.width = Math.min(tpPos / maxS * 100, 100) + '%';
        } else {
            $fill.style.width = '100%';
        }
        $tp.style.transform = 'translateY(' + (-tpPos) + 'px)';
        tpRAF = requestAnimationFrame(step);
    }
    tpRAF = requestAnimationFrame(step);
}

/* ═══════════════════ REC CONTROLS ═══════════════════ */
function chgRecSpeed(d) {
    tpSpeed = clamp(tpSpeed + d, 1, 20);
    document.getElementById('recSpd').textContent = tpSpeed + 'x';
}
function chgRecFont(d) {
    tpFont = clamp(tpFont + d, 18, 80);
    $tp.style.fontSize = tpFont + 'px';
}
function rewindTP() {
    tpPos = 0;
    $tp.style.transform = 'translateY(0px)';
    $fill.style.width = '0%';
    toast('Texto reiniciado');
}
function toggleTP() {
    tpShow = !tpShow;
    $tp.style.opacity = tpShow ? '1' : '0';
    document.querySelector('.tp-line').style.opacity = tpShow ? '1' : '0';
    document.querySelector('.tp-prog').style.opacity = tpShow ? '1' : '0';
}

function stopRec() {
    recording = false;
    if (tpRAF) cancelAnimationFrame(tpRAF);
    if (recTimer) clearInterval(recTimer);
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    $rec.classList.remove('on');
    $recVid.srcObject = null;
    $clock.textContent = '00:00';

    /* reopen panel */
    $panel.classList.remove('shrink');
    panelUp = true;
}

/* ═══════════════════ GALLERY ═══════════════════ */
function drawGallery() {
    if (!clips.length) { $gal.classList.remove('on'); return; }
    $gal.classList.add('on');
    $galList.innerHTML = clips.map(c =>
        '<div class="gal-card">' +
            '<video src="' + c.url + '" preload="metadata" playsinline></video>' +
            '<div class="gal-info">' +
                '<span>#' + c.id + ' ' + c.dur + '<br><small style="color:var(--text-dim)">' + c.res + '</small></span>' +
                '<button class="gal-dl" onclick="dlClip(' + c.id + ')"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>' +
            '</div>' +
        '</div>'
    ).join('');
}

function dlClip(id) {
    const c = clips.find(x => x.id === id);
    if (!c) return;
    const ext = c.blob.type.includes('mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = c.url;
    a.download = 'teleprompter-' + c.id + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast('Download iniciado');
}

/* ═══════════════════ TOAST ═══════════════════ */
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

/* ═══════════════════ ESC HTML ═══════════════════ */
function escHTML(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════ KEYBOARD ═══════════════════ */
document.addEventListener('keydown', (e) => {
    if (!recording) return;
    if (e.key === ' ') { e.preventDefault(); if (tpRAF) { cancelAnimationFrame(tpRAF); tpRAF = null; toast('Pausado'); } else { tpScrollLoop(); toast('Continuando'); } }
    if (e.key === 'ArrowUp')    { e.preventDefault(); chgRecSpeed(1); }
    if (e.key === 'ArrowDown')  { e.preventDefault(); chgRecSpeed(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); chgRecFont(2); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); chgRecFont(-2); }
    if (e.key === 'Home')       { e.preventDefault(); rewindTP(); }
    if (e.key === 't' || e.key === 'T') toggleTP();
    if (e.key === 'Escape')     stopRec();
});
</script>
</body>
</html>
